[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemini-web-mcp"
version = "0.1.0"
description = "Modern MCP Server wrapping Google Gemini Web (gemini.google.com) as a subagent for AI coding assistants"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [
    { name = "ut0pia" },
]
keywords = ["mcp", "gemini", "model-context-protocol", "subagent", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=1.2.0",
    "gemini-webapi>=2.1.0,<3.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
browser-cookies = [
    "gemini-webapi[browser]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
gemini-web-mcp = "gemini_web_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Jefferyu/gemini-web-mcp"
Repository = "https://github.com/Jefferyu/gemini-web-mcp"
Issues = "https://github.com/Jefferyu/gemini-web-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_web_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
mypy_path = "src"
packages = ["gemini_web_mcp"]

[[tool.mypy.overrides]]
module = ["gemini_webapi.*", "browser_cookie3.*"]
ignore_missing_imports = true
