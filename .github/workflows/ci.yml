name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }} and sync dependencies
        run: uv sync --python ${{ matrix.python-version }} --extra dev

      - name: Run Ruff lint check
        run: uv run ruff check src tests

      - name: Run Mypy strict type check
        run: uv run mypy src

      - name: Run Pytest suite
        run: uv run pytest -v
